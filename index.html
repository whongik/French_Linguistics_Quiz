<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Interactif - Linguistique Française (Chapitre 1)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; }
        h1, h2, h3 { font-family: 'Merriweather', serif; }
    </style>
</head>
<body class="text-slate-100 min-h-screen pb-12">

    <!-- En-tête -->
    <header class="bg-slate-900 border-b border-slate-800 py-6 px-8 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
                <span class="bg-blue-900/60 text-blue-300 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Université • Linguistique Française</span>
                <h1 class="text-2xl font-bold text-white mt-1">Quiz d'Évaluation : Chapitre 1</h1>
                <p class="text-xs text-slate-400">De la grammaire à la linguistique • Structure du français moderne</p>
            </div>
            <div class="flex items-center gap-4 bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-700">
                <i class="fa-solid fa-trophy text-amber-400 text-xl"></i>
                <div>
                    <div class="text-xs text-slate-400">Score global</div>
                    <div class="text-lg font-bold text-amber-400" id="score-display">0 / 20</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-4 mt-8">

        <!-- Navigation par onglets -->
        <div class="flex border-b border-slate-800 mb-8 bg-slate-900/50 p-1.5 rounded-2xl">
            <button id="btn-tab-1" onclick="switchTab('concepts')" class="flex-1 py-3 px-6 rounded-xl font-semibold text-sm transition-all flex items-center justify-center gap-2 bg-blue-600 text-white shadow-lg">
                <i class="fa-solid fa-brain"></i>
                <span>Partie 1 : Concepts Clés (10 Qs)</span>
            </button>
            <button id="btn-tab-2" onclick="switchTab('exemples')" class="flex-1 py-3 px-6 rounded-xl font-semibold text-sm transition-all flex items-center justify-center gap-2 text-slate-400 hover:text-white">
                <i class="fa-solid fa-vial"></i>
                <span>Partie 2 : Exemples Concrets (10 Qs)</span>
            </button>
        </div>

        <!-- Section 1 : Concepts Clés -->
        <div id="section-concepts" class="space-y-6"></div>

        <!-- Section 2 : Exemples Concrets -->
        <div id="section-exemples" class="space-y-6 hidden"></div>

    </main>

    <script>
        const quizConcepts = [
            {
                id: "c1",
                question: "Quelle est la différence fondamentale entre la démarche du linguiste et celle du grammairien traditionnel ?",
                options: [
                    "Le linguiste prescrit le bon usage, tandis que le grammairien observe les dialectes.",
                    "Le linguiste est descriptif et scientifique, alors que le grammairien traditionnel est prescriptif.",
                    "Le linguiste s'intéresse uniquement aux textes écrits littéraires.",
                    "Le grammairien étudie la linguistique diachronique uniquement."
                ],
                correct: 1,
                explanation: "Selon le chapitre, la linguistique est l'étude scientifique et objective du langage (descriptive), alors que la grammaire traditionnelle impose des règles normatives sur la 'bonne' façon de parler (prescriptive)."
            },
            {
                id: "c2",
                question: "Comment les sociolinguistes modernes définissent-ils la 'norme' linguistique ?",
                options: [
                    "Une loi naturelle inscrite dans la génétique humaine.",
                    "Le reflet du parler des classes sociales historiquement favorisées.",
                    "Une invention purement récente issue de la télévision et d'Internet.",
                    "Le produit exclusif des dictionnaires de l'Académie."
                ],
                correct: 1,
                explanation: "Les sociolinguistes montrent que la norme linguistique admise comme 'beau langage' est historiquement le reflet de la variété parlée par la classe dominante."
            },
            {
                id: "c3",
                question: "Qu'est-ce que le 'français standard' selon le manuel ?",
                options: [
                    "La langue parlée spontanément par tous les francophones au quotidien.",
                    "Une norme de prononciation idéalisée codifiée dans les dictionnaires et la presse institutionnelle.",
                    "Un vieux dialecte parlé uniquement dans le Nord de la France.",
                    "Le langage utilisé exclusivement par les jeunes sur les réseaux sociaux."
                ],
                correct: 1,
                explanation: "Le français standard correspond à la norme idéale véhiculée par les dictionnaires unilingues, la radio, la télévision et l'enseignement."
            },
            {
                id: "c4",
                question: "Selon la linguistique moderne, qu'entend-on par le terme 'langage' ?",
                options: [
                    "Uniquement l'écriture manuscrite.",
                    "Une faculté mentale innée permettant d'acquérir une langue naturelle.",
                    "Le vocabulaire technique des juristes et des médecins.",
                    "L'ensemble des fautes de grammaire."
                ],
                correct: 1,
                explanation: "Le langage désigne la faculté humaine universelle et innée d'acquérir un système de communication."
            },
            {
                id: "c5",
                question: "Quelle est la distinction saussurienne entre 'Langue' et 'Parole' ?",
                options: [
                    "La langue est l'acte individuel et la parole est le système abstrait.",
                    "La langue est le système linguistique partagé, tandis que la parole est l'utilisation concrète individuelle.",
                    "La langue est écrite et la parole est chantée.",
                    "Il n'y a aucune différence entre les deux notions."
                ],
                correct: 1,
                explanation: "La 'langue' est le code abstrait et collectif, tandis que la 'parole' est la mise en pratique individuelle du code dans une situation donnée."
            },
            {
                id: "c6",
                question: "Quelle est la relation prioritaire entre le code oral et le code écrit pour la plupart des linguistes ?",
                options: [
                    "Le code écrit est la seule vraie langue, l'oral n'est qu'une déformation.",
                    "Le code écrit constitue un substitut pour le code oral.",
                    "L'oral et l'écrit fonctionnent exactement avec les mêmes unités syllabiques.",
                    "Toutes les langues parlées possèdent obligatoirement un code écrit."
                ],
                correct: 1,
                explanation: "La linguistique moderne considère que le code oral est premier (présent dans toutes les langues) et que le code écrit est un substitut visuel du code oral."
            },
            {
                id: "c7",
                question: "Comment définit-on une écriture 'idéographique' par rapport à une écriture 'pictographique' ?",
                options: [
                    "Les idéogrammes utilisent des sons de lettres alphabétiques.",
                    "Les pictogrammes représentent des dessins stylisés d'idées abstraites, contrairement aux idéogrammes.",
                    "Les idéogrammes ont des dessins stylisés représentant des idées, tandis que les pictogrammes représentent directement des objets/images réels.",
                    "Elles sont toutes les deux identiques aux alphabets modernes."
                ],
                correct: 2,
                explanation: "L'écriture pictographique dessine directement l'image de l'objet (ex. pictogrammes indiens), tandis que l'écriture idéographique utilise des dessins stylisés symbolisant des idées (ex. chinois)."
            },
            {
                id: "c8",
                question: "Qu'est-ce qu'un système d'écriture 'phonographique syllabique' ?",
                options: [
                    "Un système où chaque signe représente une idée complexe sans lien avec le son.",
                    "Un système où chaque signe correspond à une syllabe complète (consonne + voyelle).",
                    "Un système qui utilise uniquement des hiéroglyphes égyptiens.",
                    "Un alphabet où chaque lettre correspond à une seule voyelle."
                ],
                correct: 1,
                explanation: "Un écriture phonographique syllabique (comme l'Inuktitut) associe chaque signe graphique à une syllabe prononcée."
            },
            {
                id: "c9",
                question: "Quelle est la définition exacte de l'étude 'diachronique' de la langue ?",
                options: [
                    "L'étude du fonctionnement de la langue à un moment précis du présent.",
                    "L'étude de l'évolution de la langue à travers son histoire.",
                    "L'analyse de l'accent des commentateurs sportifs.",
                    "La correction systématique des fautes de frappe."
                ],
                correct: 1,
                explanation: "L'analyse diachronique observe la langue dans sa durée historique et ses mutations phonétiques/syntaxiques au cours des siècles."
            },
            {
                id: "c10",
                question: "Quel sémiologue a analysé le vêtement comme un 'langage de la mode' (emploi métaphorique) ?",
                options: [
                    "Ferdinand de Saussure",
                    "Roland Barthes",
                    "René Descartes",
                    "Aristote"
                ],
                correct: 1,
                explanation: "Roland Barthes (1957) a démontré que des éléments non linguistiques comme les vêtements (ex. jeans vs cravate) fonctionnent de manière métaphorique comme des systèmes de signes."
            }
        ];

        const quizExemples = [
            {
                id: "e1",
                question: "Si un locuteur dit « C'est qu'est-ce que je vous dis » au lieu de « C'est ce que je vous dis », quelle sera la réaction d'un linguiste descriptif ?",
                options: [
                    "Il va corriger immédiatement l'erreur et infliger une pénalité.",
                    "Il va déclarer que la phrase est barbare et dépourvue de logique.",
                    "Il va noter cette forme syntaxique orale et analyser le profil sociolinguistique du locuteur sans condamner.",
                    "Il va interdire l'utilisation de cette phrase à la télévision."
                ],
                correct: 2,
                explanation: "Le linguiste relève scientifiquement la tournure oralement observée sans porter de jugement moral ('fautif' / 'bon')."
            },
            {
                id: "e2",
                question: "Avant la Révolution française de 1789, la Cour prononçait le mot 'moi' sous la forme « moué » et le peuple parisien sous la forme « moua ». Que s'est-il passé ensuite ?",
                options: [
                    "La forme « moué » est devenue obligatoire pour toute la population.",
                    "La prononciation populaire « moua » l'a emporté avec la victoire du peuple.",
                    "Le mot 'moi' a complètement disparu de la langue française.",
                    "L'Académie a créé une troisième forme 'mouo'."
                ],
                correct: 1,
                explanation: "Après 1789, le changement de pouvoir politique a entraîné l'adoption générale de la prononciation populaire « moua »."
            },
            {
                id: "e3",
                question: "Considérez l'expression normande : « Guyette el' cô qu'est su l'poumi ». Que signifie 'Guyette' ?",
                options: [
                    "Mange",
                    "Regarde (guette)",
                    "Achette",
                    "Chante"
                ],
                correct: 1,
                explanation: "Le terme dialectal 'guyette' dérive du verbe guetter et signifie 'regarde'."
            },
            {
                id: "e4",
                question: "Dans une phrase comme « J'sais pas », quelles caractéristiques du registre familier observe-t-on ?",
                options: [
                    "Inversion complexe du sujet et verbe.",
                    "Chute du 'e' caduc et omission de la particule de négation 'ne'.",
                    "Emploi d'un vocabulaire soutenu et latin.",
                    "Utilisation d'un idéogramme chinois."
                ],
                correct: 1,
                explanation: "Le registre familier à l'oral se caractérise fréquemment par la chute des voyelles faibles (caduc) et la suppression du 'ne' ne gardant que le 'pas'."
            },
            {
                id: "e5",
                question: "Associer la rose rouge au symbole de l'amour passionné est un exemple de :",
                options: [
                    "Code linguistique syllabique",
                    "Emploi métaphorique non linguistique du terme langage",
                    "Variation diachronique phonétique",
                    "Formule de politesse formelle"
                ],
                correct: 1,
                explanation: "Il s'agit du 'langage des fleurs', un emploi métaphorique où des objets visuels véhiculent une signification conventionnelle."
            },
            {
                id: "e6",
                question: "Quelle est l'unité de découpage prioritaire dans le code oral par rapport au code écrit ?",
                options: [
                    "L'oral privilégie les mots et les paragraphes.",
                    "L'oral privilégie la syllabe, le groupe rythmique et la mélodie.",
                    "L'oral ne comporte aucune organisation.",
                    "L'oral est découpé uniquement par des points d'interrogation."
                ],
                correct: 1,
                explanation: "Comme expliqué au paragraphe 10, le code oral s'organise autour de la syllabe et du rythme, tandis que l'écrit privilégie le mot et la phrase."
            },
            {
                id: "e7",
                question: "Dans les caractères chinois, l'association du dessin de la 'femme' (女) et de l' 'enfant' (子) forme le caractère 好 qui signifie 'bon / aimer'. De quel type d'écriture s'agit-il ?",
                options: [
                    "Écriture alphabétique",
                    "Écriture idéographique",
                    "Écriture syllabique inuktitut",
                    "Pictogramme maya"
                ],
                correct: 1,
                explanation: "Il s'agit d'un idéogramme, où la combinaison stylisée de deux idées simples crée un concept abstrait ('bon')."
            },
            {
                id: "e8",
                question: "Observer le passage du latin 'noctem' au français moderne 'nuit' relève de :",
                options: [
                    "L'analyse synchronique",
                    "L'analyse diachronique",
                    "Un registre de langue soutenu",
                    "Un préjugé sociolinguistique"
                ],
                correct: 1,
                explanation: "Suivre la modification phonétique d'un mot au cours de l'histoire (latin -> français) est une démarche typiquement diachronique."
            },
            {
                id: "e9",
                question: "Quelle a été l'évolution historique de l'écriture sumérienne en Mésopotamie ?",
                options: [
                    "Elle est passée d'un alphabet moderne à des hiéroglyphes.",
                    "Elle a évolué de dessins pictographiques réalistes vers des formes stylisées en coins (cunéiforme).",
                    "Elle s'est transformée en écriture inuktitut.",
                    "Elle n'a jamais changé au cours des siècles."
                ],
                correct: 1,
                explanation: "L'écriture sumérienne est passée progressivement de pictogrammes figuratifs gravés à des signes cunéiformes (en forme de clous)."
            },
            {
                id: "e10",
                question: "Si un diplomate s'adresse à un ambassadeur en disant « Bonsoir ma chère mère, je vous adresse mes salutations », quelle est l'anomalie ?",
                options: [
                    "Il y a une faute de grammaire diachronique.",
                    "Inadéquation du registre : emploie de formules soutenu/formelles inappropriées avec un membre de la famille très proche.",
                    "Le code oral a été remplacé par un idéogramme.",
                    "C'est du français standard parfait."
                ],
                correct: 1,
                explanation: "Les usagers adaptent leur registre à l'interlocuteur. Utiliser des formules extrêmement cérémonieuses avec sa mère est socialement incongru."
            }
        ];

        let userAnswers = {};

        function renderQuestions(questions, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = questions.map((q, idx) => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl" id="card-${q.id}">
                    <div class="flex items-start justify-between gap-4 mb-4">
                        <span class="bg-blue-950 text-blue-400 font-bold text-xs px-3 py-1 rounded-lg border border-blue-800">
                            Question ${idx + 1}
                        </span>
                    </div>
                    <h3 class="text-lg font-bold text-slate-100 mb-4">${q.question}</h3>
                    <div class="space-y-3 mb-6">
                        ${q.options.map((opt, optIdx) => `
                            <button onclick="selectOption('${q.id}', ${optIdx}, ${q.correct})" 
                                id="opt-${q.id}-${optIdx}"
                                class="w-full text-left p-4 rounded-xl bg-slate-800/60 border border-slate-700/60 hover:bg-slate-800 hover:border-slate-600 transition-all text-sm text-slate-200 flex items-center justify-between group">
                                <span>${opt}</span>
                                <i class="fa-regular fa-circle text-slate-500 group-hover:text-slate-300" id="icon-${q.id}-${optIdx}"></i>
                            </button>
                        `).join('')}
                    </div>
                    <div id="expl-${q.id}" class="hidden mt-4 p-4 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-300 leading-relaxed">
                        <strong class="text-amber-400 block mb-1"><i class="fa-solid fa-lightbulb mr-1"></i> Explication Linguistique :</strong>
                        ${q.explanation}
                    </div>
                </div>
            `).join('');
        }

        function selectOption(qId, selectedIdx, correctIdx) {
            if (userAnswers[qId] !== undefined) return; // Déjà répondu

            userAnswers[qId] = selectedIdx;
            const isCorrect = selectedIdx === correctIdx;

            // Update UI
            const btn = document.getElementById(`opt-${qId}-${selectedIdx}`);
            const icon = document.getElementById(`icon-${qId}-${selectedIdx}`);

            if (isCorrect) {
                btn.classList.remove('bg-slate-800/60', 'border-slate-700/60');
                btn.classList.add('bg-emerald-950/80', 'border-emerald-600', 'text-emerald-200');
                icon.className = 'fa-solid fa-circle-check text-emerald-400 text-base';
            } else {
                btn.classList.remove('bg-slate-800/60', 'border-slate-700/60');
                btn.classList.add('bg-rose-950/80', 'border-rose-600', 'text-rose-200');
                icon.className = 'fa-solid fa-circle-xmark text-rose-400 text-base';

                // Highlight correct one
                const correctBtn = document.getElementById(`opt-${qId}-${correctIdx}`);
                const correctIcon = document.getElementById(`icon-${qId}-${correctIdx}`);
                correctBtn.classList.remove('bg-slate-800/60', 'border-slate-700/60');
                correctBtn.classList.add('bg-emerald-950/40', 'border-emerald-700/60', 'text-emerald-300');
                correctIcon.className = 'fa-solid fa-circle-check text-emerald-500 text-base';
            }

            // Show explanation
            document.getElementById(`expl-${qId}`).classList.remove('hidden');

            updateScore();
        }

        function updateScore() {
            let score = 0;
            const allQs = [...quizConcepts, ...quizExemples];
            allQs.forEach(q => {
                if (userAnswers[q.id] === q.correct) score++;
            });
            document.getElementById('score-display').innerText = `${score} / ${allQs.length}`;
        }

        function switchTab(tab) {
            const btn1 = document.getElementById('btn-tab-1');
            const btn2 = document.getElementById('btn-tab-2');
            const sec1 = document.getElementById('section-concepts');
            const sec2 = document.getElementById('section-exemples');

            if (tab === 'concepts') {
                btn1.className = 'flex-1 py-3 px-6 rounded-xl font-semibold text-sm transition-all flex items-center justify-center gap-2 bg-blue-600 text-white shadow-lg';
                btn2.className = 'flex-1 py-3 px-6 rounded-xl font-semibold text-sm transition-all flex items-center justify-center gap-2 text-slate-400 hover:text-white';
                sec1.classList.remove('hidden');
                sec2.classList.add('hidden');
            } else {
                btn2.className = 'flex-1 py-3 px-6 rounded-xl font-semibold text-sm transition-all flex items-center justify-center gap-2 bg-blue-600 text-white shadow-lg';
                btn1.className = 'flex-1 py-3 px-6 rounded-xl font-semibold text-sm transition-all flex items-center justify-center gap-2 text-slate-400 hover:text-white';
                sec2.classList.remove('hidden');
                sec1.classList.add('hidden');
            }
        }

        // Init
        window.onload = () => {
            renderQuestions(quizConcepts, 'section-concepts');
            renderQuestions(quizExemples, 'section-exemples');
        };
    </script>
</body>
</html>
