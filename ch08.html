let currentSection = 'concept';
let currentQuestionIndex = 0;
let userAnswers = {};

function getSectionQuestions() {
    return quizData.filter(q => q.section === currentSection);
}

function renderQuestion() {
    const questions = getSectionQuestions();
    const q = questions[currentQuestionIndex];
    const container = document.getElementById('quiz-container');

    // Update Progress
    document.getElementById('progress-text').innerText = `Question ${currentQuestionIndex + 1} / ${questions.length}`;
    document.getElementById('section-title').innerText = currentSection === 'concept' ? 'Section 1 : Notions Théoriques' : 'Section 2 : Exercices d\'Application';
    document.getElementById('progress-fill').style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;

    const isAnswered = userAnswers[q.id] !== undefined;

    let optionsHTML = '';
    q.options.forEach((opt, idx) => {
        let btnClass = 'option-btn';
        if (isAnswered) {
            if (idx === q.correct) {
                btnClass += ' selected-correct';
            } else if (userAnswers[q.id] === idx) {
                btnClass += ' selected-incorrect';
            }
        }

        optionsHTML += `
            <button class="${btnClass}" onclick="selectAnswer(${q.id}, ${idx})" ${isAnswered ? 'disabled' : ''}>
                <span>${opt}</span>
                ${isAnswered && idx === q.correct ? '<i class="fa-solid fa-circle-check"></i>' : ''}
                ${isAnswered && userAnswers[q.id] === idx && idx !== q.correct ? '<i class="fa-solid fa-circle-xmark"></i>' : ''}
            </button>
        `;
    });

    container.innerHTML = `
        <div class="quiz-card active">
            <div class="question-number">${q.number}</div>
            <div class="question-text">${q.question}</div>
            <div class="options-grid">${optionsHTML}</div>
            
            <div class="explanation-box ${isAnswered ? 'show' : ''}">
                <h4><i class="fa-solid fa-lightbulb"></i> Explication Détaillée :</h4>
                <p>${q.explanation}</p>
            </div>

            <div class="action-nav">
                <button class="btn-nav" onclick="prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>
                    <i class="fa-solid fa-arrow-left"></i> Précédent
                </button>
                <button class="btn-nav" onclick="nextQuestion()">
                    ${currentQuestionIndex === questions.length - 1 ? 'Voir le Bilan <i class="fa-solid fa-flag-checkered"></i>' : 'Suivant <i class="fa-solid fa-arrow-right"></i>'}
                </button>
            </div>
        </div>
    `;
}

function selectAnswer(questionId, optionIndex) {
    userAnswers[questionId] = optionIndex;
    renderQuestion();
}

function nextQuestion() {
    const questions = getSectionQuestions();
    if (currentQuestionIndex < questions.length - 1) {
        currentQuestionIndex++;
        renderQuestion();
    } else {
        showResults();
    }
}

function prevQuestion() {
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderQuestion();
    }
}

function switchSection(section) {
    currentSection = section;
    currentQuestionIndex = 0;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    if (section === 'concept') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
    } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
    }
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('quiz-container').style.display = 'block';
    renderQuestion();
}

function showResults() {
    document.getElementById('quiz-container').style.display = 'none';
    const resultScreen = document.getElementById('result-screen');
    resultScreen.style.display = 'block';

    const questions = getSectionQuestions();
    let score = 0;
    questions.forEach(q => {
        if (userAnswers[q.id] === q.correct) {
            score++;
        }
    });

    document.getElementById('final-score').innerHTML = `${score}/${questions.length} <span>Points</span>`;
    
    let msg = "";
    if (score === questions.length) {
        msg = "Excellente maîtrise ! Vous avez assimilé parfaitement tous les concepts de phonétique prosodique.";
    } else if (score >= questions.length * 0.7) {
        msg = "Très bon travail ! Vos connaissances sur l'accentuation française sont solides.";
    } else {
        msg = "Certains points nécessitent une révision. N'hésitez pas à relire les diapositives de cours.";
    }
    document.getElementById('feedback-message').innerText = msg;
}

function restartQuiz() {
    userAnswers = {};
    currentQuestionIndex = 0;
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('quiz-container').style.display = 'block';
    renderQuestion();
}

// Initial Call
renderQuestion();
</script>

</body>
</html>
